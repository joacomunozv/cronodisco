<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cronodisco">
<meta name="theme-color" content="#5c1424">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Cronodisco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
/* VOICE: party game, warm and bold, readable from across a table
   IDEA: a record shelf; each card is a sleeve standing in year order
   PICTURE: a spinning record that plays the hidden song beside the player's shelf
   COLOUR and TYPE: oxblood ground, paper sleeves, hot pink accent; Archivo Black + Archivo
   LAYOUT: score strip on top, player left, timeline right; stacks under 900px */
:root{color-scheme:light dark;
--bg:light-dark(#f4eee6,#1c0b10);--ink:light-dark(#22090f,#f6ece3);--soft:light-dark(#7a5a60,#c9a9ad);
--band:light-dark(#5c1424,#3a1119);--bandink:#fbeee6;--card:light-dark(#fffaf3,#2c1318);--line:light-dark(#e2d4c8,#4a2229);
--acc:#ff3d6e;--ok:#1f9d6b;--bad:#d8363c}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 Archivo,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3,.yr,.big{font-family:"Archivo Black",Archivo,system-ui,sans-serif;font-weight:400;line-height:1.05;margin:0}
button,.btn{font:600 16px Archivo,system-ui,sans-serif;min-height:48px;padding:0 18px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;gap:8px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.ghost{background:transparent}
button.danger{color:var(--bad)}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{font:16px Archivo,system-ui,sans-serif;min-height:48px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%}
header{background:var(--band);color:var(--bandink);padding:12px max(3vw,14px);padding-top:max(12px,env(safe-area-inset-top));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:24px;margin-right:auto}
header button{background:transparent;color:var(--bandink);border-color:#ffffff40;min-height:40px}
header button.on{background:#ffffff22}
.score{display:flex;gap:8px;flex-wrap:wrap;padding:10px max(3vw,14px);background:var(--band);border-top:1px solid #ffffff22}
.chip{color:var(--bandink);border:2px solid #ffffff30;border-radius:999px;padding:6px 14px;display:flex;gap:10px;align-items:center;font-size:15px}
.chip.on{background:var(--acc);border-color:var(--acc)}
.chip b{font-family:"Archivo Black",system-ui;font-weight:400}
.dots{letter-spacing:2px}
main{padding:20px max(3vw,14px) 40px;max-width:1400px;margin:auto}
.narrow{max-width:720px;margin:auto}
.play{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:24px;align-items:start}
.panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:20px}
.panel+.panel{margin-top:16px}
.who{font-size:15px;color:var(--soft);margin:0 0 4px}
h2{font-size:34px;margin-bottom:12px}
h3{font-size:22px;margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.row>*{flex:1 1 140px}
.hint{color:var(--soft);font-size:15px;margin:10px 0 0}
.err{color:var(--bad);font-weight:600}
.deck{display:grid;place-items:center;aspect-ratio:1;border-radius:16px;background:radial-gradient(circle at 50% 50%,#3a1119,#160608);position:relative;overflow:hidden}
.rec{width:78%;aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,#1a1a1a 0 2px,#262626 2px 4px);box-shadow:0 12px 30px #0008,inset 0 0 0 8px #111;display:grid;place-items:center;border:none;padding:0;min-height:0}
.rec::after{content:"";width:34%;aspect-ratio:1;border-radius:50%;background:var(--acc);box-shadow:inset 0 0 0 6px #0002}
.rec.spin{animation:spin 2.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.rec.spin{animation:none}}
.playlbl{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#fbeee6;font-weight:800;font-size:15px;pointer-events:none}
.tl{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.slot{min-width:44px;width:44px;min-height:118px;padding:0;border:2px dashed var(--line);background:transparent;border-radius:12px;font-size:22px;color:var(--soft);position:relative}
.slot.sel{border:3px solid var(--acc);background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc);width:64px}
.slot.ch{border-style:solid;border-color:#7d5cff}
.slot .tag{position:absolute;left:50%;transform:translateX(-50%);bottom:6px;font-size:12px;background:#7d5cff;color:#fff;border-radius:6px;padding:1px 5px;white-space:nowrap}
.slot.right{border:3px solid var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}
.sleeve{width:118px;min-height:118px;border-radius:12px;background:var(--band);color:var(--bandink);padding:10px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 3px 0 #0003}
.sleeve .yr{font-size:28px}
.sleeve small{font-size:13px;line-height:1.2;opacity:.85;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.big{font-size:56px}
.code{font-family:"Archivo Black",system-ui;font-size:clamp(48px,9vw,88px);letter-spacing:.12em;line-height:1}
.verdict{font:800 20px Archivo,system-ui,sans-serif;padding:8px 14px;border-radius:10px;display:inline-block;margin-top:6px;color:#fff}
.verdict.ok{background:var(--ok)}.verdict.bad{background:var(--bad)}
.lobby{display:grid;grid-template-columns:minmax(240px,340px) minmax(0,1fr);gap:24px;align-items:start}
.qr{background:#fff;border-radius:16px;padding:12px;aspect-ratio:1}
.qr svg{width:100%;height:100%;display:block}
.list{display:grid;gap:8px;margin:12px 0 0;padding:0;list-style:none}
.list li{display:flex;align-items:center;gap:10px;justify-content:space-between;border:2px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px;min-height:52px}
.list li.me{border-color:var(--acc)}
.list li.turn{background:color-mix(in srgb,var(--acc) 14%,transparent);border-color:var(--acc)}
.list small{color:var(--soft)}
.pill{font-size:13px;font-weight:800;border-radius:999px;padding:3px 10px;background:var(--line);white-space:nowrap}
.pill.st-lobby{background:#7d5cff;color:#fff}.pill.st-playing{background:var(--acc);color:#fff}.pill.st-finished{background:var(--ok);color:#fff}
.decks{display:grid;gap:8px;margin-top:10px}
.decks label{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}
.decks input{width:22px;min-height:22px;flex:none;accent-color:var(--acc)}
.decks label:has(input:checked){border-color:var(--acc)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:16px 0}
.opts label{display:grid;gap:6px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--soft);font-weight:600}
.overlay{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:20px;z-index:9}
.overlay .panel{max-width:520px;width:100%}
.pick{display:grid;gap:8px;margin-top:12px}
.win{text-align:center;padding:40px 20px}
.win .big{font-size:clamp(40px,7vw,72px);margin:12px 0}
.note{font-size:13px;color:var(--soft);margin-top:18px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--acc)}
.turnbox{border-radius:16px;padding:18px;background:var(--acc);color:#fff;text-align:center;font-weight:800;font-size:22px}
a{color:inherit}
@media(max-width:900px){.play,.lobby{grid-template-columns:minmax(0,1fr)}.qrcol{max-width:420px;width:100%;margin:auto}}
@media(max-width:600px){.sleeve{width:96px}.sleeve .yr{font-size:22px}h2{font-size:28px}.big{font-size:40px}
  .stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{border:0;padding:2px 0}}
</style>
</head>
<body>
<header><h1>Cronodisco</h1><nav id="nav" style="display:flex;gap:8px;flex-wrap:wrap"></nav></header>
<div class="score" id="score" hidden></div>
<main id="app"></main>
<div id="ov"></div>
<audio id="au" preload="auto"></audio>
<p class="note" style="text-align:center;padding:0 16px 20px">Fragmentos de 30 s desde la API de Deezer. Uso privado, no comercial.</p>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
{
/* ===================== base ===================== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = $('#app'), au = $('#au');
const cfg = window.CRONO_CONFIG || {};
// Enlaces de ingreso antiguos volvían a ".../#admin" y Supabase agregaba "#access_token=..." detrás: se limpia antes de crear el cliente
if(/^#admin[#&?]/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search + '#' + location.hash.replace(/^#admin[#&?]/, ''));
const sb = window.supabase && cfg.supabaseUrl && !/SUPABASE_/.test(cfg.supabaseUrl) ? window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey) : null;
const BASE = location.origin + location.pathname;
const KEY = 'cronodisco-game-v3', PKEY = 'cronodisco-player-v3';
function ls(k, v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)||'null'); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null } }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]] } return a }
const fmtDate = d => d ? new Date(d).toLocaleString('es-CL', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'}) : '';
let timers = [];
function clearTimers(){ timers.forEach(t => clearInterval(t)); timers = []; channels.forEach(c => sb && sb.removeChannel(c)); channels = [] }
let channels = [];
function overlay(html){ $('#ov').innerHTML = `<div class="overlay"><div class="panel">${html}</div></div>` }
function closeOv(){ $('#ov').innerHTML = '' }
function confirmBox(title, text, okLabel, onOk){
  overlay(`<h2>${esc(title)}</h2><p class="hint">${esc(text)}</p><div class="row"><button type="button" id="cNo">Volver</button><button type="button" class="pri" id="cYes">${esc(okLabel)}</button></div>`);
  $('#cNo').onclick = closeOv; $('#cYes').onclick = () => { closeOv(); onOk() };
}
function qrSvg(text){
  try{ const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({cellSize: 6, margin: 2, scalable: true}) }
  catch(e){ return `<p class="hint">${esc(text)}</p>` }
}

/* ===================== Deezer (JSONP) ===================== */
function jsonp(url){
  return new Promise((res, rej) => {
    const cb = 'dz' + Math.random().toString(36).slice(2), s = document.createElement('script');
    const done = () => { clearTimeout(t); delete window[cb]; s.remove() };
    const t = setTimeout(() => { done(); rej(new Error('timeout')) }, 9000);
    window[cb] = d => { done(); res(d) };
    s.onerror = () => { done(); rej(new Error('red')) };
    s.src = url + (url.includes('?') ? '&' : '?') + 'output=jsonp&callback=' + cb;
    document.head.appendChild(s);
  });
}
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\(.*?\)|\[.*?\]/g,' ').replace(/ - .*$/,' ').replace(/feat\..*$/,' ').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
async function findDeezer(a, t){
  const a1 = a.split(/ feat\.| & | and | x |, /i)[0];
  let d = (await jsonp('https://api.deezer.com/search?limit=25&q=' + encodeURIComponent(`artist:"${a1}" track:"${t}"`))).data || [];
  if(!d.length) d = (await jsonp('https://api.deezer.com/search?limit=25&q=' + encodeURIComponent(a1 + ' ' + t))).data || [];
  const nt = norm(t), na = norm(a1), bad = /live|remix|karaoke|instrumental|cover|tribute|version|edit|acoustic|demo/i;
  let best = null, bs = -1;
  for(const r of d){
    let s = 0; const rt = norm(r.title), ra = norm(r.artist.name);
    if(rt===nt) s+=50; else if(rt.startsWith(nt)||nt.startsWith(rt)) s+=30; else if(rt.includes(nt)||nt.includes(rt)) s+=15;
    if(ra===na) s+=40; else if(ra.includes(na)||na.includes(ra)) s+=25;
    if(r.preview) s+=20; if(bad.test(r.title+' '+r.album.title)) s-=25;
    s += Math.min(10,(r.rank||0)/100000);
    if(s>bs){bs=s;best=r}
  }
  return best ? {id: best.id, score: bs} : null;
}

/* ===================== router ===================== */
const params = new URLSearchParams(location.search);
function nav(items){ $('#nav').innerHTML = items.map(([id,l,on]) => `<button type="button" data-nav="${id}" class="${on?'on':''}">${esc(l)}</button>`).join(''); $$('[data-nav]').forEach(b => b.onclick = () => go(b.dataset.nav)) }
function go(view, arg){ clearTimers(); $('#score').hidden = true; closeOv(); VIEWS[view](arg) }
const VIEWS = {};

/* ===================== JUGADOR (celular) ===================== */
VIEWS.join = () => {
  nav([['admin','Anfitrión']]);
  if(!sb){ app.innerHTML = `<section class="panel narrow"><h2>Falta configurar</h2><p class="hint">La app aún no está conectada a la base de datos.</p></section>`; return }
  const saved = ls(PKEY), code = (params.get('c') || saved?.code || '').toUpperCase();
  if(saved && saved.code === code && saved.player_id) return VIEWS.waiting();
  app.innerHTML = `<section class="panel narrow">
    <p class="who">Unirse a una partida</p><h2>¿Juegas?</h2>
    <form id="fJoin"><div class="opts" style="grid-template-columns:1fr">
      <label>Código de la partida<input id="jCode" value="${esc(code)}" maxlength="6" autocomplete="off" autocapitalize="characters" style="font-family:'Archivo Black';letter-spacing:.15em;text-transform:uppercase"></label>
      <label>Tu nombre<input id="jName" value="${esc(saved?.name||'')}" maxlength="18" autocomplete="nickname"></label>
    </div><button class="pri" type="submit" style="width:100%">Entrar a la sala</button></form>
    <p class="hint" id="jMsg"></p></section>`;
  $('#fJoin').onsubmit = async e => {
    e.preventDefault(); $('#jMsg').textContent = 'Uniéndote…';
    const {data, error} = await sb.rpc('join_game', {p_code: $('#jCode').value, p_name: $('#jName').value});
    if(error){ $('#jMsg').innerHTML = `<span class="err">${esc(error.message)}</span>`; return }
    ls(PKEY, {code: data.code, player_id: data.player_id, name: data.name});
    history.replaceState(null, '', BASE + '?c=' + data.code);
    VIEWS.waiting();
  };
};
VIEWS.waiting = () => {
  const me = ls(PKEY); if(!me) return VIEWS.join();
  nav([['admin','Anfitrión']]);
  const paint = st => {
    if(!st){ app.innerHTML = `<section class="panel narrow"><h2>La partida ya no existe</h2><div class="row"><button class="pri" type="button" id="bOut">Unirme a otra</button></div></section>`; $('#bOut').onclick = () => { ls(PKEY,null); history.replaceState(null,'',BASE); go('join') }; return }
    const inList = st.players.some(p => p.name.toLowerCase() === me.name.toLowerCase());
    const myTurn = st.status==='playing' && st.turn_name && st.turn_name.toLowerCase() === me.name.toLowerCase();
    const head = st.status==='lobby' ? (inList ? `<h2>Estás dentro, ${esc(me.name)}</h2><p class="hint">Espera a que el administrador inicie la partida.</p>` : `<h2>Te quitaron de la sala</h2>`)
      : st.status==='playing' ? (myTurn ? `<div class="turnbox">¡Es tu turno! Mira el iPad</div>` : `<h2>Partida en curso</h2><p class="hint">Turno de ${esc(st.turn_name||'…')}</p>`)
      : st.status==='finished' ? `<p class="who">Ganador</p><div class="big">${esc(st.winner||'')}</div>` : `<h2>Partida cancelada</h2>`;
    app.innerHTML = `<section class="panel narrow">
      <p class="who">Partida ${esc(st.code)} · ${esc(st.deck_names)} · gana quien junte ${st.win_cards}</p>${head}
      <ul class="list">${st.players.map(p => `<li class="${p.name.toLowerCase()===me.name.toLowerCase()?'me':''} ${st.status==='playing'&&p.name===st.turn_name?'turn':''}"><span><b>${esc(p.name)}</b></span>${st.status==='lobby'?'':`<span><b>${p.cards}/${st.win_cards}</b> <span class="dots">${'●'.repeat(p.tokens)}</span></span>`}</li>`).join('')}</ul>
      <div class="row">${st.status==='lobby' && inList ? `<button type="button" class="ghost" id="bLeave">Salir de la sala</button>` : `<button type="button" id="bOut">Unirme a otra partida</button>`}</div></section>`;
    if($('#bLeave')) $('#bLeave').onclick = async () => { await sb.rpc('leave_game', {p_player_id: me.player_id}); ls(PKEY,null); go('join') };
    if($('#bOut')) $('#bOut').onclick = () => { ls(PKEY,null); history.replaceState(null,'',BASE); go('join') };
  };
  const poll = async () => { const {data} = await sb.rpc('game_state', {p_code: me.code}); paint(data) };
  poll(); timers.push(setInterval(poll, 3000));
};

/* ===================== ADMIN ===================== */
let session = null, isAdmin = false, isHost = false, profile = null;
async function checkAdmin(){
  const {data} = await sb.auth.getSession(); session = data.session;
  if(!session){ isAdmin = isHost = false; profile = null; return false }
  const [a, h, p] = await Promise.all([sb.rpc('is_admin'), sb.rpc('is_host'), sb.from('profiles').select('*').eq('user_id', session.user.id).maybeSingle()]);
  isAdmin = !!a.data; isHost = !!h.data; profile = p.data || null; return isHost;
}
function adminNav(cur){
  const items = [['newgame','Nueva partida',cur==='newgame'],['games','Partidas',cur==='games']];
  if(isAdmin) items.push(['decks','Mazos',cur==='decks'],['users', pendingCount ? `Usuarios (${pendingCount})` : 'Usuarios', cur==='users']);
  items.push(['account','Cuenta',cur==='account'],['logout','Salir']);
  nav(items);
}
let pendingCount = 0;
async function refreshPending(){ if(!isAdmin) return; const {count} = await sb.from('profiles').select('user_id', {count: 'exact', head: true}).eq('status', 'pending'); pendingCount = count || 0 }
VIEWS.users = async () => {
  if(!isAdmin) return go('admin');
  await refreshPending(); adminNav('users');
  const {data, error} = await sb.from('profiles').select('*').order('created_at', {ascending: false});
  if(error){ app.innerHTML = `<section class="panel"><p class="err">${esc(error.message)}</p></section>`; return }
  const me = session.user.id, lbl = {pending:'Pendiente', approved:'Aprobado', rejected:'Rechazado'};
  const row = u => `<tr><td><b>${esc(u.name || '—')}</b><br><small class="who">${esc(u.email)}</small></td><td><span class="pill ${u.status==='approved'?'st-finished':u.status==='pending'?'st-lobby':''}">${lbl[u.status]}</span></td><td>${fmtDate(u.created_at)}</td>
    <td style="text-align:right">${u.user_id===me ? '<small class="who">Tú (administrador)</small>' : `
      ${u.status!=='approved' ? `<button type="button" class="pri" data-ok="${esc(u.user_id)}">Aprobar</button>` : `<button type="button" data-no="${esc(u.user_id)}">Quitar acceso</button>`}
      ${u.status==='pending' ? `<button type="button" data-no="${esc(u.user_id)}">Rechazar</button>` : ''}
      <button type="button" class="ghost danger" data-del="${esc(u.user_id)}" data-name="${esc(u.name || u.email)}">Eliminar</button>`}</td></tr>`;
  const groups = [['pending','Solicitudes pendientes'],['approved','Anfitriones aprobados'],['rejected','Rechazados']];
  app.innerHTML = groups.map(([k,t]) => { const list = data.filter(u => u.status===k); return `<section class="panel"><h3>${t} (${list.length})</h3>${list.length ? `<table class="stack"><thead><tr><th>Usuario</th><th>Estado</th><th>Registro</th><th></th></tr></thead><tbody>${list.map(row).join('')}</tbody></table>` : '<p class="hint">Nadie por ahora.</p>'}</section>` }).join('') + '<p class="hint" id="uMsg"></p>';
  const setStatus = async (id, status) => { const {error} = await sb.from('profiles').update({status, decided_at: new Date().toISOString()}).eq('user_id', id); if(error) $('#uMsg').innerHTML = `<span class="err">${esc(error.message)}</span>`; else go('users') };
  $$('[data-ok]').forEach(b => b.onclick = () => setStatus(b.dataset.ok, 'approved'));

/* --- Mazos --- */
function parseCSV(txt){
  const rows = []; let row = [], f = '', q = false;
  for(let i=0;i<txt.length;i++){
    const c = txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){f+='"';i++} else q=false } else f+=c }
    else if(c==='"') q = true;
    else if(c===',' || c===';' || c==='\t'){ row.push(f); f='' }
    else if(c==='\n' || c==='\r'){ if(c==='\r' && txt[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f='' }
    else f += c;
  }
  if(f || row.length){ row.push(f); rows.push(row) }
  return rows.filter(r => r.some(x => x.trim()));
}

  }
  const seen = new Set();
  DECK = all.filter(s => !seen.has(s.deezer_id) && seen.add(s.deezer_id)).map(s => [s.artist, s.title, s.year, s.deezer_id]);
  if(DECK.length < players.length + 5){ $('#lbMsg').innerHTML = '<span class="err">El mazo tiene muy pocas canciones.</span>'; $('#bStart').disabled = false; return }
  const deck = shuffle(DECK.map((_,i)=>i));
  const ps = players.map(p => ({id: p.id, name: p.name, tokens: g.start_tokens, tl: [deck.pop()]}));
  let first = 0; ps.forEach((p,i) => { if(yr(p.tl[0]) < yr(ps[first].tl[0])) first = i });
  S = {gameId: g.id, code: g.code, deckNames: g.deck_names, players: ps, deck, discard: [], turn: first, win: g.win_cards, phase: 'listen', card: deck.pop(), slot: null, ch: [], named: false, res: null, winner: null};
  hist = []; store();
  await sb.from('games').update({status: 'playing', started_at: new Date().toISOString(), turn_name: ps[first].name}).eq('id', g.id);
  go('play');
}
function sync(){
  if(!sb || !S?.gameId) return;
  clearTimeout(syncT);
  syncT = setTimeout(async () => {
    const s = S; if(!s) return;
    await Promise.all(s.players.map(p => sb.from('players').update({cards: p.tl.length, tokens: p.tokens}).eq('id', p.id)));
    const upd = s.winner != null ? {status: 'finished', winner: s.players[s.winner].name, turn_name: null, finished_at: new Date().toISOString()} : {turn_name: s.players[s.turn].name};
    await sb.from('games').update(upd).eq('id', s.gameId);
  }, 600);
}
async function prefetch(i){
  const id = DECK[i]?.[3]; prev = {id, url:null, err:null, card:i};
  au.pause(); au.removeAttribute('src');
  if(!id){ prev.err = 'Sin ID de Deezer'; return paintPlayer() }
  try{
    const d = await jsonp('https://api.deezer.com/track/' + id);
    if(prev.card !== i) return;
    if(d.error || !d.preview) prev.err = 'Sin fragmento disponible'; else { prev.url = d.preview; au.src = d.preview; au.load() }
  }catch(e){ if(prev.card===i) prev.err = 'Sin conexión con Deezer' }
  paintPlayer();
}
function hideMeta(){ try{ if('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({title:'Cronodisco', artist:'¿Qué año es?'}) }catch(e){} }
au.addEventListener('play', () => { hideMeta(); paintPlayer() });
au.addEventListener('pause', paintPlayer); au.addEventListener('ended', paintPlayer);

function insertSorted(tl, c){ const i = tl.findIndex(k => yr(k) > yr(c)); i<0 ? tl.push(c) : tl.splice(i,0,c) }
function slotOk(tl, k, c){ const y = yr(c); return (k===0 || y >= yr(tl[k-1])) && (k===tl.length || y <= yr(tl[k])) }
function draw(){ if(!S.deck.length) S.deck = shuffle(S.discard.splice(0)); return S.deck.length ? S.deck.pop() : S.card }
function newCard(){ S.discard.push(S.card); S.card = draw(); S.slot = null; prefetch(S.card) }

function scoreBar(){
  $('#score').hidden = false;
  $('#score').innerHTML = S.players.map((p,i)=>`<div class="chip ${i===S.turn?'on':''}"><span>${esc(p.name)}</span><b>${p.tl.length}/${S.win}</b><span class="dots" aria-label="${p.tokens} fichas">${'●'.repeat(p.tokens)}${'○'.repeat(Math.max(0,5-p.tokens))}</span></div>`).join('') + `<div class="chip" style="margin-left:auto">Sala ${esc(S.code)} · ${S.deck.length} en el mazo</div>`;
}
function timeline(p, interactive){
  const tl = p.tl; let h = '';
  for(let k=0;k<=tl.length;k++){
    const chs = S.ch.filter(c=>c.slot===k);
    const cls = ['slot', S.slot===k?'sel':'', chs.length?'ch':'', S.phase==='reveal' && S.res && !S.res.ok && slotOk(tl,k,S.card) ? 'right':''].join(' ');
    h += `<button type="button" class="${cls}" data-slot="${k}" ${interactive?'':'disabled'} aria-label="Ubicar en posición ${k+1}">${S.slot===k?'▼':'+'}${chs.map(c=>`<span class="tag">${esc(S.players[c.p].name.slice(0,6))}</span>`).join('')}</button>`;
    if(k<tl.length){ const c = DECK[tl[k]]; h += `<div class="sleeve"><span class="yr">${c[2]}</span><small>${esc(c[0])}<br>${esc(c[1])}</small></div>` }
  }
  return `<div class="tl">${h}</div>`;
}
function paintPlayer(){
  const box = $('#player'); if(!box || !S || S.phase!=='listen') return;
  const playing = !au.paused && !au.ended;
  const lbl = prev.err ? prev.err : !prev.url ? 'Cargando…' : playing ? 'Toca para pausar' : 'Toca para escuchar';
  box.innerHTML = `<div class="deck"><button type="button" class="rec ${playing?'spin':''}" id="bPlay" aria-label="${esc(lbl)}" ${prev.url?'':'disabled'}></button><span class="playlbl">${esc(lbl)}</span></div>`;
  $('#bPlay').onclick = () => { if(au.paused || au.ended){ if(au.ended) au.currentTime = 0; au.play().catch(()=>{}) } else au.pause() };
}
VIEWS.play = () => {
  S = ls(KEY); DECK = ls(KEY + '-deck') || [];
  if(!S || !DECK.length) return go(isHost ? 'newgame' : 'admin');
  nav([['undo','Deshacer'],['endgame','Terminar'],['games','Partidas']]);
  render(); if(S.phase==='listen' && S.winner==null) prefetch(S.card);
};
VIEWS.undo = () => { if(hist.length && S){ const before = S.card; S = JSON.parse(hist.pop()); render(); if(S.card!==before && S.phase==='listen') prefetch(S.card) } nav([['undo','Deshacer'],['endgame','Terminar'],['games','Partidas']]) };
VIEWS.endgame = () => {
  if(!S) return go('newgame');
  nav([['undo','Deshacer'],['endgame','Terminar'],['games','Partidas']]); render();
  confirmBox('¿Terminar esta partida?', 'Quedará como cancelada en el historial.', 'Terminar', async () => { au.pause(); const id = S.gameId; S = null; ls(KEY, null); if(sb && id) await sb.from('games').update({status:'cancelled', turn_name:null, finished_at:new Date().toISOString()}).eq('id', id); go('newgame') });
};
function render(){
  store(); sync(); scoreBar();
  if(S.winner!=null){
    au.pause();
    const w = S.players[S.winner];
    app.innerHTML = `<section class="panel win"><p class="who">Ganador</p><div class="big">${esc(w.name)}</div><p>${w.tl.length} canciones en orden.</p>${timeline(w,false)}<div class="row" style="justify-content:center"><button class="pri" id="bAgain" type="button">Nueva partida</button></div></section>`;
    $('#bAgain').onclick = () => { S = null; ls(KEY,null); go('newgame') };
    return;
  }
  const p = P(), listen = S.phase==='listen', c = DECK[S.card];
  const left = listen ? `<div id="player"></div>
      <div class="row">
        <button type="button" id="bRe">Repetir</button>
        <button type="button" id="bSkip" ${p.tokens<1?'disabled':''}>Saltar (−1 ficha)</button>
        <button type="button" id="bNoPlay">No suena: otra</button>
        <button type="button" id="bBuy" ${p.tokens<3||S.slot!=null?'disabled':''}>Comprar carta (3 fichas)</button>
      </div>`
    : `<div><span class="big">${c[2]}</span></div>
      <p style="margin:8px 0 0;font-weight:800">${esc(c[1])}</p><p style="margin:0" class="who">${esc(c[0])}</p>
      <span class="verdict ${S.res.ok?'ok':'bad'}">${esc(S.res.msg)}</span>
      <p class="hint"><a href="https://www.deezer.com/track/${encodeURIComponent(c[3])}" target="_blank" rel="noopener">Escuchar completa en Deezer</a></p>
      <div class="row">
        <button type="button" id="bNamed" ${S.named||p.tokens>=5?'disabled':''}>${S.named?'Ficha ganada ✓':'Nombró artista y título (+1)'}</button>
        <button type="button" class="pri" id="bNext">Siguiente turno</button>
      </div>`;
  const others = S.players.map((q,i)=>({q,i})).filter(o=>o.i!==S.turn && o.q.tokens>0 && !S.ch.some(x=>x.p===o.i));
  app.innerHTML = `<div class="play">
    <section class="panel qrcol"><p class="who">Turno de</p><h2>${esc(p.name)}</h2>${left}</section>
    <section class="panel">
      <p class="who">${listen ? (S.slot==null ? 'Toca dónde va la canción en tu línea de tiempo' : 'Posición elegida. Los demás pueden desafiar antes de revelar.') : 'Resultado'}</p>
      ${timeline(p, listen)}
      ${listen ? `<div class="row">
        <button type="button" id="bCh" ${S.slot==null||!others.length?'disabled':''}>Desafiar (−1 ficha)</button>
        <button type="button" class="pri" id="bRev" ${S.slot==null?'disabled':''}>Revelar</button></div>
        ${S.chMode!=null ? `<p class="hint">${esc(S.players[S.chMode].name)}: toca otra posición para desafiar.</p>`:''}` : ''}
    </section></div>`;
  $$('[data-slot]').forEach(b => b.onclick = () => {
    const k = +b.dataset.slot;
    if(S.chMode!=null){
      if(k===S.slot || S.ch.some(x=>x.slot===k)) return;
      snap(); S.players[S.chMode].tokens--; S.ch.push({p:S.chMode, slot:k}); S.chMode = null; render(); return;
    }
    if(S.ch.length) return;
    S.slot = S.slot===k ? null : k; render();
  });
  if(listen){
    paintPlayer();
    $('#bRe').onclick = () => { if(prev.url){ au.currentTime = 0; au.play().catch(()=>{}) } };
    $('#bSkip').onclick = () => { snap(); p.tokens--; newCard(); render() };
    $('#bNoPlay').onclick = () => { snap(); newCard(); render() };
    $('#bBuy').onclick = () => { snap(); p.tokens-=3; S.discard.push(S.card); insertSorted(p.tl, draw()); finishTurn() };
    $('#bCh').onclick = () => {
      overlay(`<h2>¿Quién desafía?</h2><div class="pick">${others.map(o=>`<button type="button" data-who="${o.i}">${esc(o.q.name)} · ${o.q.tokens} fichas</button>`).join('')}<button type="button" id="bX">Cancelar</button></div>`);
      $$('[data-who]').forEach(b => b.onclick = () => { S.chMode = +b.dataset.who; closeOv(); render() });
      $('#bX').onclick = closeOv;
    };
    $('#bRev').onclick = reveal;
  } else {
    $('#bNamed').onclick = () => { snap(); p.tokens = Math.min(5,p.tokens+1); S.named = true; render() };
    $('#bNext').onclick = () => { snap(); finishTurn() };
  }
}
function reveal(){
  snap(); au.pause();
  const p = P(), ok = slotOk(p.tl, S.slot, S.card);
  let msg;
  if(ok){ insertSorted(p.tl, S.card); S.slot=null; S.ch=[]; msg = '¡Correcto!' }
  else {
    const w = S.ch.find(x => slotOk(p.tl, x.slot, S.card));
    if(w){ insertSorted(S.players[w.p].tl, S.card); msg = `Incorrecto: ${S.players[w.p].name} se la roba` }
    else { S.discard.push(S.card); msg = 'Incorrecto: carta descartada' }
  }
  S.res = {ok, msg}; S.phase = 'reveal'; S.chMode = null;
  checkWin(); render();
}
function checkWin(){ const i = S.players.findIndex(q => q.tl.length >= S.win); if(i>=0) S.winner = i }
function finishTurn(){
  checkWin();
  if(S.winner==null){ S.turn = (S.turn+1) % S.players.length; S.card = draw(); S.phase='listen'; S.slot=null; S.ch=[]; S.named=false; S.res=null; S.chMode=null; prefetch(S.card) }
  render();
}

/* ===================== inicio ===================== */
const authRedirect = /access_token|refresh_token|type=magiclink|error_description/.test(location.hash) || params.has('code') || params.has('admin');
if(sb) sb.auth.onAuthStateChange((ev, s) => {
  session = s;
  if(ev === 'SIGNED_OUT'){ isAdmin = isHost = false; profile = null }
  if(ev === 'SIGNED_IN' && authRedirect){ history.replaceState(null, '', BASE + '#admin'); setTimeout(() => go('admin'), 0) }
});
window.addEventListener('hashchange', () => { if(location.hash === '#admin' || location.hash === '#registro') go('admin') });
go(authRedirect || location.hash === '#admin' || location.hash === '#registro' || (!params.get('c') && ls(KEY)) ? 'admin' : 'join');
}
</script>
